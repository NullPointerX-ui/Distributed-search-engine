spark.master                                spark://node3:7077

# ---- Apache Iceberg on HDFS (Hadoop catalog, no Hive metastore needed) ----
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                 hadoop
spark.sql.catalog.lake.warehouse            hdfs://node2:9000/warehouse
spark.hadoop.fs.defaultFS                   hdfs://node2:9000

# ---- Resources (sized for ~4 GB / 2 vCPU VMs; raise if yours are bigger) ----
spark.driver.memory                         1g
spark.executor.memory                       1g
spark.executor.cores                        1
spark.cores.max                             4
spark.sql.shuffle.partitions                8
spark.default.parallelism                   8

# ---- Fault tolerance ----
spark.task.maxFailures                      4
spark.speculation                           false

# ---- Fixed driver ports so the firewall rules are predictable ----
spark.driver.port                           7078
spark.blockManager.port                     7079
spark.port.maxRetries                       16

# ---- Event logs: lets you show "where the time and network traffic went" ----
spark.eventLog.enabled                      true
spark.eventLog.dir                          hdfs://node2:9000/spark-logs
spark.history.fs.logDirectory               hdfs://node2:9000/spark-logs
